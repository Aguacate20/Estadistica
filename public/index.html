<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arena de Pruebas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Manrope:wght@500;700;800&display=swap">
<link rel="stylesheet" href="/arena.css">
<meta name="theme-color" content="#0c1711">
</head>
<body>
<div class="wrap" id="app"></div>
<canvas id="confetti" hidden></canvas>
<script src="/shared/stats.js"></script>
<script src="/shared/challenges.js"></script>
<script src="/shared/plots.js"></script>
<script>
const S=ArenaStats,P=ArenaPlots,CH=ArenaChallenges.publicList();
const $=s=>document.querySelector(s);const esc=P.esc;const LETTERS=["A","B","C","D"];
const app=$("#app");
function load(k,fb){try{const v=localStorage.getItem(k);return v?JSON.parse(v):fb;}catch(_){return fb;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(_){}}
let me=load("arena-me",null); // {code,teamId,token,name,emoji}
let state=null; let offset=0; let pollTimer=null; let view=location.hash==="#equipo"?"join":"home"; let pending=null; let fb=null;
const EMOJIS=["🧪","🧠","🔬","📊","🎯","🚀","🦉","🐙","🌵","⚡","🎲","🧩"];
async function api(path,body){const r=await fetch("/api/"+path,body?{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}:undefined);const j=await r.json().catch(()=>({error:"Respuesta inválida"}));if(!r.ok)throw Object.assign(new Error(j.error||"Error"),{status:r.status,data:j});return j;}
function toast(msg){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=msg;t.hidden=false;clearTimeout(t._t);t._t=setTimeout(()=>t.hidden=true,2600);}
const ordinal=n=>n+".º";
function timeLeft(){if(!state||!state.game.endsAt)return null;return Math.max(0,state.game.endsAt-(Date.now()+offset));}
function fmtT(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");}

/* ---------- red ---------- */
async function refresh(){if(!me)return;try{const q=`state?code=${me.code}&team=${me.teamId}`;const s=await api(q);offset=s.game.serverNow-Date.now();state=s;onState();}catch(e){if(e.status===404){toast("La arena ya no existe. Vuelvan a entrar.");me=null;save("arena-me",null);view="home";render();}}}
function startPolling(ms){clearInterval(pollTimer);pollTimer=setInterval(refresh,ms);}
function onState(){
  if(!state.you){me=null;save("arena-me",null);view="home";render();return;}
  const g=state.game,you=state.you;
  if(g.status==="lobby"){if(view!=="lobby"){view="lobby";}render();return;}
  if(g.status==="ended"){view="ended";render();return;}
  if(you.finishedAt){view="finished";render();return;}
  if(view!=="play"){view="play";fb=null;render();return;}
  paintHeader();
}

/* ---------- vistas ---------- */
function render(){
  if(!me&&view==="home")return renderHome();
  if(!me||view==="join")return renderJoin();
  if(view==="lobby")return renderLobby();
  if(view==="play")return renderPlay();
  if(view==="finished")return renderFinished();
  if(view==="ended")return renderEnded();
}
function renderHome(){
  clearInterval(pollTimer);
  app.innerHTML=`<div><div class="eyebrow">Diseños de investigación I · Corte III</div><h1>Arena de Pruebas</h1><p class="lead" style="font-size:17px;max-width:62ch">Una competencia por equipos para aprender, jugando, cómo funcionan las pruebas estadísticas: señal y ruido, tamaño del efecto, cuántos participantes hacen falta, qué prueba toca, cómo se lee y cómo se escribe un resultado. Seis mundos, más de sesenta retos en orden distinto para cada equipo, un reloj y un marcador en vivo. No hace falta saber nada de antemano: cada reto trae su lección.</p></div>
  <div class="opts">
    <button class="opt" id="goTeam" style="min-height:84px"><span class="k">📱</span><span><b style="font-size:18px">Soy un equipo</b><br><span class="hint">Tenemos el código de 4 letras que puso el profe en el proyector.</span></span></button>
    <a class="opt" href="/profe" style="min-height:84px;text-decoration:none"><span class="k">📺</span><span><b style="font-size:18px">Soy el profe</b><br><span class="hint">Crear la arena, proyectar el código, abrir el reloj y ver la carrera.</span></span></a>
  </div>
  <div class="card"><h3>Cómo se juega</h3><ol style="margin:8px 0 0;padding-left:20px;color:var(--ink2);line-height:1.65"><li>El profe crea una arena y proyecta un <b>código de 4 letras</b>.</li><li>Cada equipo entra con ese código, su nombre y una ficha. Aparece en el proyector al instante.</li><li>Cuando el profe abre la arena arranca el reloj. Cada equipo recorre <b>seis mundos de retos a su ritmo</b> desde el celular (el orden dentro de cada mundo es distinto para cada equipo); el proyector muestra la carrera y el marcador en vivo.</li><li>Cada reto vale hasta <b>100 puntos</b> y se responde una sola vez: acierten o no, enseguida ven por qué. Tres retos perfectos seguidos: <b>racha</b>, +25 por cada uno más.</li><li>Cada reto empieza con <b>“Primero, lo básico”</b> y termina con el <b>porqué</b>. Y arriba siempre está 📖 <b>Recuerda los conceptos</b>.</li><li>Hay de todo: elegir, ordenar, emparejar, verdadero/falso en ráfaga, mover deslizadores y correr la máquina de réplicas.</li><li>Al terminar el reloj, podio para todos.</li></ol></div>
  <div class="card"><h3>Los seis mundos</h3><div class="row" style="margin-top:8px">${ArenaChallenges.ZONES.map(z=>`<span class="pill">${z.emoji} ${esc(z.name)} · ${CH.filter(c=>c.zone===z.id).length}</span>`).join("")}</div><p class="hint" style="margin-top:10px">Hablen antes de tocar. Gana quien justifica por el diseño, no quien adivina.</p></div>`;
  $("#goTeam").addEventListener("click",()=>{view="join";render();});
}
function renderJoin(){
  clearInterval(pollTimer);
  const saved=load("arena-draft",{code:"",name:"",emoji:"🧪"});
  app.innerHTML=`<div><div class="eyebrow">Diseños de investigación I · Corte III</div><h1>Arena de Pruebas</h1><p class="lead" style="font-size:17px">Seis mundos y más de sesenta retos para ver, con los ojos, cómo funcionan las pruebas estadísticas. Cada equipo avanza a su ritmo; el marcador se mueve en vivo en el proyector.</p></div>
  <div class="card"><label class="eyebrow" for="code">Código de la arena</label><input class="code" type="text" id="code" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(saved.code)}" placeholder="ABCD" style="margin-top:6px">
    <label class="eyebrow" for="name" style="display:block;margin-top:14px">Nombre del equipo</label><input type="text" id="name" maxlength="24" value="${esc(saved.name)}" placeholder="p. ej., Los de la confianza en IA" style="margin-top:6px">
    <div class="eyebrow" style="margin-top:14px">Su ficha</div><div class="emojis" id="em" style="margin-top:6px">${EMOJIS.map(e=>`<button type="button" aria-pressed="${e===saved.emoji}" data-e="${e}">${e}</button>`).join("")}</div>
    <div class="row" style="margin-top:14px"><button class="btn big" id="go">Entrar a la arena</button></div><div class="hint" id="err" style="color:var(--red);margin-top:6px"></div></div>
  <button class="btn sec" id="back">← Volver al inicio</button>`;
  let emoji=saved.emoji;
  document.querySelectorAll("#em button").forEach(b=>b.addEventListener("click",()=>{emoji=b.dataset.e;document.querySelectorAll("#em button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));}));
  const go=async()=>{const code=$("#code").value.trim().toUpperCase(),name=$("#name").value.trim();save("arena-draft",{code,name,emoji});$("#err").textContent="";if(code.length!==4){$("#err").textContent="El código tiene 4 letras.";return;}if(!name){$("#err").textContent="Pongan un nombre de equipo.";return;}$("#go").disabled=true;
    try{const r=await api("join",{code,name,emoji});me={code,teamId:r.teamId,token:r.token,name,emoji};save("arena-me",me);view="lobby";await refresh();startPolling(2500);}catch(e){$("#err").textContent=e.message;$("#go").disabled=false;}};
  $("#go").addEventListener("click",go);$("#name").addEventListener("keydown",e=>{if(e.key==="Enter")go();});$("#back").addEventListener("click",()=>{view="home";render();});
}
function header(){const you=state?.you;const left=timeLeft();return`<div class="top"><div><div class="eyebrow">Arena ${esc(me.code)}</div><h3 style="margin-top:2px">${esc(me.emoji)} ${esc(me.name)}</h3></div><div class="row" id="hdrPills">${you?`<span class="pill mint">${you.pts} pts</span><span class="pill">${ordinal(you.position)} de ${state.teams.length}</span>`:""}${left!==null&&state.game.status==="live"?`<span class="pill amber" id="tl">${fmtT(left)}</span>`:""}<button class="pill" type="button" id="chulBtn" title="Recuerda los conceptos">📖</button></div></div>`;}
document.addEventListener("click",e=>{if(e.target&&e.target.id==="chulBtn")openChuleta();});
function paintHeader(){const h=$("#hdr");if(h)h.innerHTML=header();}
function renderLobby(){
  app.innerHTML=`<div id="hdr">${header()}</div><div class="card center"><div class="eyebrow">Esperando al profe</div><h2 style="margin-top:6px">La arena arranca cuando el profe la abra</h2><p class="lead">Ya están adentro. Mientras tanto, miren quién llegó.</p></div>
  <div class="card"><h3>Equipos en la arena · ${state.teams.length}</h3><div class="row" style="margin-top:10px">${state.teams.map(t=>`<span class="pill ${t.id===me.teamId?"mint":""}">${esc(t.emoji)} ${esc(t.name)}</span>`).join("")}</div></div>
  <div class="card"><h3>El recorrido</h3><ol style="margin:8px 0 0;padding-left:20px;color:var(--ink2);line-height:1.6">${ArenaChallenges.ZONES.map(z=>`<li><b>${z.emoji} ${esc(z.name)}</b> · ${CH.filter(c=>c.zone===z.id).length} retos</li>`).join("")}</ol><p class="hint" style="margin-top:8px">Mientras esperan, abran 📖 Recuerda los conceptos (botón de arriba).</p></div>
  <button class="btn sec" id="leave">Salir de la arena</button>`;
  $("#leave").addEventListener("click",()=>{me=null;save("arena-me",null);view="home";render();});
}
/* ---------- juego ---------- */
let ctl={};
const ZONES=ArenaChallenges.ZONES,GLOSSARY=ArenaChallenges.GLOSSARY;
const CHMAP=Object.fromEntries(CH.map(c=>[c.id,c]));
function myOrder(){const o=state.you&&state.you.order;return o&&o.length?o:CH.map(c=>c.id);}
function current(){const o=myOrder();return CHMAP[o[state.you.step]];}
function zoneOf(c){return ZONES.find(z=>z.id===c.zone);}
function permFor(c,n){const seed=((state.you&&state.you.seed)||1)*31+[...c.id].reduce((a,ch)=>a*7+ch.charCodeAt(0),0);const r=S.rng(seed);const idx=Array.from({length:n},(_,i)=>i);for(let i=n-1;i>0;i--){const j=Math.floor(r.u()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
let seenZones=load("arena-zones-"+(me?me.code:""),[]);
function renderPlay(){
  const you=state.you;const c=current();if(!c){view="finished";return render();}
  const z=zoneOf(c);
  if(z&&!seenZones.includes(z.id))return renderZoneIntro(z);
  const order=myOrder();const N=order.length;
  const prog=`<div class="progress">${ZONES.map(zz=>{const ids=order.filter(id=>CHMAP[id].zone===zz.id);const done=ids.filter(id=>order.indexOf(id)<you.step).length;return`<span class="${done===ids.length?"done":ids.includes(c.id)?"cur":""}" title="${esc(zz.name)}"></span>`;}).join("")}</div>`;
  let body="";ctl={};
  const attempts=(you.attempts&&you.attempts[c.id])||0;const p=c.params||{};
  const optsHtml=(opts)=>{const perm=permFor(c,opts.length);return`<div class="opts" id="opts">${perm.map((i,k)=>`<button class="opt" type="button" data-i="${i}" aria-pressed="false"><span class="k">${LETTERS[k]}</span><span>${esc(opts[i])}</span></button>`).join("")}</div>`;};
  if(p.design)body+=`<div class="card" style="padding:12px">${P.design(p.design)}</div>`;
  if(c.kind==="signal"||c.kind==="dslider"){const {a,b}=S.sim(p.seed,p.n,p.n,p.d);body+=`<div class="card" style="padding:12px">${P.groups([a,b],["Control","Experimental"],"Puntaje en la variable dependiente",20,100)}</div>`;}
  if(c.kind==="rslider"){const {x,y}=S.simCorr(p.seed,p.n,p.r);body+=`<div class="card" style="padding:12px;max-width:420px;margin:0 auto;width:100%">${P.scatter(x,y,"")}</div>`;}
  if(c.kind==="corrpick"){const A=S.simCorr(p.a.seed,p.a.n,p.a.r),B=S.simCorr(p.b.seed,p.b.n,p.b.r);body+=`<div class="two" id="opts"><button class="opt pick" type="button" data-i="0" aria-pressed="false">${P.scatter(A.x,A.y,"A")}</button><button class="opt pick" type="button" data-i="1" aria-pressed="false">${P.scatter(B.x,B.y,"B")}</button></div><button class="btn big" id="send" disabled>Enviar respuesta</button>`;}
  if(p.items&&(c.kind==="multi"||c.kind==="mcq"))body+=`<div class="card" style="padding:12px">${P.cis(p.items)}</div>`;
  if(c.kind==="mcq"&&p.sig!==undefined)body+=`<div class="card" style="padding:12px">${P.repsFixed(p.sig,p.reps)}</div>`;
  if(c.kind==="signal"||c.kind==="mcq"){body+=optsHtml(c.opts)+`<button class="btn big" id="send" disabled>Enviar respuesta</button>`;}
  if(c.kind==="multi"){body+=optsHtml(c.opts)+`<p class="hint" style="margin:0">Pueden marcar varias. Toquen de nuevo para quitar.</p><button class="btn big" id="send" disabled>Enviar selección</button>`;}
  if(c.kind==="vf"){const perm=permFor(c,c.opts.length);body+=`<div class="vf" id="opts">${perm.map(i=>[c.opts[i],i]).map(([o,i])=>`<div class="vfrow" data-i="${i}"><span>${esc(o)}</span><div class="vfbtns"><button type="button" class="vfb" data-v="true" aria-pressed="false">V</button><button type="button" class="vfb" data-v="false" aria-pressed="false">F</button></div></div>`).join("")}</div><button class="btn big" id="send" disabled>Enviar las cuatro</button>`;}
  if(c.kind==="order"){let cards="";if(p.items)cards=p.items.map((it,i)=>{const {a,b}=S.sim(it.seed,it.n,it.n,it.d);return`<button class="opt ord" type="button" data-i="${i}"><span class="k rk"></span><span style="flex:1;min-width:0">${P.miniGroups(a,b,it.k)}</span></button>`;}).join("");
    else if(p.cis)cards=`<div class="card" style="padding:12px">${P.cis(p.cis)}</div>`+p.cis.map((it,i)=>`<button class="opt ord" type="button" data-i="${i}"><span class="k rk"></span><span>Estudio ${it.k} · [${it.lo.toFixed(1)}, ${it.hi.toFixed(1)}]</span></button>`).join("");
    else cards=p.labels.map((l,i)=>`<button class="opt ord" type="button" data-i="${i}"><span class="k rk"></span><span>${esc(l)}</span></button>`).join("");
    body+=`<div class="opts" id="opts">${cards}</div><div class="row"><button class="btn sec" id="undo">Deshacer</button><button class="btn big" id="send" style="flex:1;width:auto" disabled>Enviar orden</button></div>`;}
  if(c.kind==="match"){body+=`<div class="match" id="opts"><div class="col" id="mL">${p.left.map((l,i)=>`<button class="opt" type="button" data-side="L" data-i="${i}" aria-pressed="false"><span class="k">${i+1}</span><span>${esc(l)}</span></button>`).join("")}</div><div class="col" id="mR">${permFor(c,p.right.length).map((i,k)=>`<button class="opt" type="button" data-side="R" data-i="${i}" aria-pressed="false"><span class="k">${LETTERS[k]}</span><span>${esc(p.right[i])}</span></button>`).join("")}</div></div><p class="hint" style="margin:0" id="mhint">Toquen un elemento de la izquierda y luego su pareja de la derecha.</p><div class="row"><button class="btn sec" id="undo">Deshacer</button><button class="btn big" id="send" style="flex:1;width:auto" disabled>Enviar parejas</button></div>`;}
  if(c.kind==="dslider"){body+=`<div class="card"><div class="top"><span class="eyebrow">Su estimación</span><span class="big" id="val">d = 0.50</span></div><input type="range" id="sl" min="${p.min}" max="${p.max}" step="${p.step}" value="0.5"><div class="row" style="justify-content:space-between;font-size:13px;color:var(--muted)"><span>0 · nada</span><span>0.5 · mediano</span><span>1.6 · enorme</span></div><p class="hint" id="slh" style="margin-top:8px">Un d de 0.50 significa que las medias están separadas media desviación estándar.</p></div><button class="btn big" id="send">Enviar d = 0.50</button>`;}
  if(c.kind==="rslider"){body+=`<div class="card"><div class="top"><span class="eyebrow">Su estimación</span><span class="big" id="val">r = 0.00</span></div><input type="range" id="sl" min="${p.min}" max="${p.max}" step="${p.step}" value="0"><div class="row" style="justify-content:space-between;font-size:13px;color:var(--muted)"><span>−1 · perfecta al revés</span><span>0 · nada</span><span>+1 · perfecta</span></div><p class="hint" id="slh" style="margin-top:8px">r = 0: la nube es redonda, X no dice nada de Y.</p></div><button class="btn big" id="send">Enviar r = 0.00</button>`;}
  if(c.kind==="nslider"){body+=`<div class="card" style="padding:12px" id="pw">${P.power(p.d,30)}</div><div class="card"><div class="top"><span class="eyebrow">Personas por grupo</span><span class="big" id="val">30</span></div><input type="range" id="sl" min="${p.min}" max="${p.max}" step="1" value="30"><p class="hint" id="slh" style="margin-top:8px">Con 30 por grupo la potencia es ${Math.round(S.power(p.d,30)*100)} %.</p></div><button class="btn big" id="send">Enviar n = 30</button>`;}
  if(c.kind==="replicas"){body+=`<div class="card"><div class="top"><span class="eyebrow">Personas por grupo</span><span class="big" id="val">15</span></div><input type="range" id="sl" min="${p.min}" max="${p.max}" step="1" value="15"><div class="row" style="margin-top:8px"><button class="btn sec" id="run">▶ Correr la máquina (20 réplicas)</button></div><div id="repOut" style="margin-top:10px"><p class="hint" style="margin:0">Todavía no han corrido la máquina.</p></div></div><button class="btn big" id="send" disabled>Enviar n = 15</button>`;}
  app.innerHTML=`<div id="hdr">${header()}</div>${prog}
  <div class="card"><div class="top"><span class="pill">Reto ${you.step+1} de ${N}</span><span class="pill">${z?z.emoji+" "+esc(z.name):""}</span></div><h2 style="margin-top:10px">${esc(c.title)}</h2>
    <details class="lesson" open><summary>📖 Primero, lo básico</summary><p>${esc(c.lesson)}</p></details>
    <p style="margin:12px 0 0;font-size:17px;font-weight:700">${esc(c.prompt)}</p></div>${body}<div id="fb"></div>`;
  wire(c);
}
function renderZoneIntro(z){
  const order=myOrder();const n=order.filter(id=>CHMAP[id].zone===z.id).length;
  app.innerHTML=`<div id="hdr">${header()}</div><div class="card zone"><div class="eyebrow">Mundo ${ZONES.indexOf(z)+1} de ${ZONES.length} · ${n} retos</div><div class="zemoji">${z.emoji}</div><h2>${esc(z.name)}</h2><p style="margin:10px 0 0;font-size:17px;line-height:1.55">${esc(z.intro)}</p><p class="why" style="margin-top:12px"><b>Para recordar:</b> ${esc(z.tip)}</p></div><button class="btn big" id="goZone">¡Entrar al mundo!</button><button class="btn sec" id="gloss">📖 Recuerda los conceptos</button>`;
  $("#goZone").addEventListener("click",()=>{seenZones.push(z.id);save("arena-zones-"+me.code,seenZones);render();});
  $("#gloss").addEventListener("click",openChuleta);
}
function openChuleta(){let m=$("#chul");if(m){m.hidden=false;return;}m=document.createElement("div");m.id="chul";m.className="modal";m.innerHTML=`<div class="modalbox"><div class="top"><h2>Recuerda los conceptos</h2><button class="btn sec" id="chulClose">Cerrar</button></div><div class="gloss">${GLOSSARY.map(g=>`<div><b>${esc(g.k)}</b><p>${esc(g.t)}</p></div>`).join("")}</div></div>`;document.body.appendChild(m);$("#chulClose").addEventListener("click",()=>{m.hidden=true;});m.addEventListener("click",e=>{if(e.target===m)m.hidden=true;});}
function wire(c){
  const p=c.params||{};
  if(c.kind==="signal"||c.kind==="mcq"||c.kind==="corrpick"){document.querySelectorAll("#opts .opt").forEach(b=>b.addEventListener("click",()=>{ctl.answer=+b.dataset.i;document.querySelectorAll("#opts .opt").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("#send").disabled=false;}));}
  if(c.kind==="multi"){ctl.answer=[];document.querySelectorAll("#opts .opt").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i;const on=b.getAttribute("aria-pressed")==="true";b.setAttribute("aria-pressed",String(!on));ctl.answer=on?ctl.answer.filter(x=>x!==i):[...ctl.answer,i];$("#send").disabled=ctl.answer.length===0;}));}
  if(c.kind==="vf"){ctl.answer=new Array(c.opts.length).fill(null);document.querySelectorAll(".vfrow").forEach(row=>{const i=+row.dataset.i;row.querySelectorAll(".vfb").forEach(b=>b.addEventListener("click",()=>{ctl.answer[i]=b.dataset.v==="true";row.querySelectorAll(".vfb").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));$("#send").disabled=ctl.answer.some(v=>v===null);}));});}
  if(c.kind==="order"){ctl.answer=[];const paint=()=>{document.querySelectorAll("#opts .ord").forEach(b=>{const k=ctl.answer.indexOf(+b.dataset.i);b.querySelector(".rk").textContent=k>=0?k+1:"";b.setAttribute("aria-pressed",String(k>=0));});$("#send").disabled=ctl.answer.length!==document.querySelectorAll("#opts .ord").length;};
    document.querySelectorAll("#opts .ord").forEach(b=>b.addEventListener("click",()=>{const i=+b.dataset.i;if(ctl.answer.includes(i))return;ctl.answer.push(i);paint();}));$("#undo").addEventListener("click",()=>{ctl.answer.pop();paint();});paint();}
  if(c.kind==="match"){ctl.answer=new Array(p.left.length).fill(null);let sel=null;const paint=()=>{document.querySelectorAll("#mL .opt").forEach(b=>{const i=+b.dataset.i;const r=ctl.answer[i];b.setAttribute("aria-pressed",String(sel===i));const letterOf=j=>{const btn=document.querySelector(`#mR .opt[data-i="${j}"]`);return btn?btn.querySelector(".k").textContent.replace(/[^A-D]/g,""):"";};b.querySelector(".k").textContent=r===null?i+1:(i+1)+"→"+letterOf(r);b.classList.toggle("paired",r!==null);});document.querySelectorAll("#mR .opt").forEach(b=>{const j=+b.dataset.i;b.classList.toggle("paired",ctl.answer.includes(j));b.setAttribute("aria-pressed","false");});$("#send").disabled=ctl.answer.some(v=>v===null);$("#mhint").textContent=sel===null?"Toquen un elemento de la izquierda y luego su pareja de la derecha.":"Ahora toquen su pareja a la derecha.";};
    document.querySelectorAll("#mL .opt").forEach(b=>b.addEventListener("click",()=>{sel=+b.dataset.i;paint();}));
    document.querySelectorAll("#mR .opt").forEach(b=>b.addEventListener("click",()=>{if(sel===null)return;const j=+b.dataset.i;ctl.answer=ctl.answer.map(v=>v===j?null:v);ctl.answer[sel]=j;sel=null;paint();}));
    $("#undo").addEventListener("click",()=>{ctl.answer=ctl.answer.map(()=>null);sel=null;paint();});paint();}
  if(c.kind==="dslider"){const sl=$("#sl");ctl.answer=0.5;sl.addEventListener("input",()=>{const v=+sl.value;ctl.answer=v;$("#val").textContent="d = "+v.toFixed(2);$("#send").textContent="Enviar d = "+v.toFixed(2);$("#slh").textContent=v<0.2?"Casi nada: los dos grupos serían prácticamente iguales.":v<0.5?"Pequeño: se nota midiendo con cuidado, no a simple vista.":v<0.8?"Mediano: se nota, pero los grupos se traslapan mucho.":v<1.2?"Grande: se ve a simple vista en un grupo, aún con traslape.":"Enorme: casi no hay traslape entre los grupos.";});}
  if(c.kind==="rslider"){const sl=$("#sl");ctl.answer=0;sl.addEventListener("input",()=>{const v=+sl.value;ctl.answer=v;$("#val").textContent="r = "+v.toFixed(2);$("#send").textContent="Enviar r = "+v.toFixed(2);const a=Math.abs(v);$("#slh").textContent=(a<0.1?"Prácticamente nula: nube redonda.":a<0.3?"Débil: apenas se insinúa una dirección.":a<0.5?"Moderada: la nube se alarga claramente.":a<0.8?"Fuerte: los puntos siguen una franja.":"Muy fuerte: casi una línea.")+(v<0?" Negativa: cuando X sube, Y baja.":v>0?" Positiva: suben juntas.":"");});}
  if(c.kind==="nslider"){const sl=$("#sl");ctl.answer=30;sl.addEventListener("input",()=>{const v=+sl.value;ctl.answer=v;$("#val").textContent=v;$("#send").textContent="Enviar n = "+v;$("#pw").innerHTML=P.power(p.d,v);$("#slh").textContent=`Con ${v} por grupo la potencia es ${Math.round(S.power(p.d,v)*100)} %.`;});}
  if(c.kind==="replicas"){const sl=$("#sl");ctl.answer=15;sl.addEventListener("input",()=>{const v=+sl.value;ctl.answer=v;$("#val").textContent=v;$("#send").textContent="Enviar n = "+v;$("#send").disabled=true;$("#repOut").innerHTML=`<p class="hint" style="margin:0">Cambiaron el n: corran la máquina de nuevo.</p>`;});
    $("#run").addEventListener("click",()=>{const n=ctl.answer;const r=S.replicate(p.seedBase,n,p.d,p.reps);$("#repOut").innerHTML=`<div class="top"><span class="big" style="color:${r.sig>=p.need?"var(--mint)":"var(--amber)"}">${r.sig} de ${p.reps}</span><span class="hint">meta: ${p.need} o más</span></div><div style="margin-top:8px">${P.reps(r.ps,p.need)}</div><p class="hint" style="margin-top:8px">${r.sig>=p.need?"Alcanza. ¿Será que con menos gente también? Prueben bajar el n antes de enviar: menos personas, más puntos.":"No alcanza: con este n el mismo experimento fallaría muchas veces. Suban el n antes de enviar (solo hay un envío)."}</p>`;$("#send").disabled=false;});}
  $("#send").addEventListener("click",submit);
}
async function submit(){
  const c=current();const btn=$("#send");btn.disabled=true;btn.textContent="Enviando…";
  try{const r=await api("submit",{code:me.code,team:me.teamId,token:me.token,ch:c.id,answer:ctl.answer});
    state.you={...state.you,...r.you,order:state.you.order,attempts:{...(state.you.attempts||{}),[c.id]:((state.you.attempts||{})[c.id]||0)+1}};paintHeader();
    showFeedback(c,r);}
  catch(e){if(e.status===409&&e.data.you){await refresh();render();return;}toast(e.message);btn.disabled=false;btn.textContent=e.status===429?"Enviar de nuevo":"Enviar";}
}
function showFeedback(c,r){
  const key=Array.isArray(r.correct)?r.correct:[r.correct];
  if(c.kind==="vf"){document.querySelectorAll(".vfrow").forEach(row=>{const i=+row.dataset.i;row.querySelectorAll(".vfb").forEach(b=>{b.disabled=true;const v=b.dataset.v==="true";if(v===r.correct[i])b.classList.add("ok");else if(b.getAttribute("aria-pressed")==="true")b.classList.add("bad");});});}
  else if(c.kind==="order"){document.querySelectorAll("#opts .ord").forEach(b=>{b.disabled=true;const i=+b.dataset.i;const pos=r.correct.indexOf(i);const mine=ctl.answer.indexOf(i);b.querySelector(".rk").textContent=(pos+1)+(mine===pos?" ✓":"");b.classList.add(mine===pos?"ok":"bad");});const u=$("#undo");if(u)u.hidden=true;}
  else if(c.kind==="match"){document.querySelectorAll("#mL .opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;const ok=ctl.answer[i]===r.correct[i];const rb=document.querySelector(`#mR .opt[data-i="${r.correct[i]}"]`);b.querySelector(".k").textContent=(i+1)+"→"+(rb?rb.querySelector(".k").textContent.replace(/[^A-D]/g,""):"");b.classList.add(ok?"ok":"bad");});document.querySelectorAll("#mR .opt").forEach(b=>b.disabled=true);const u=$("#undo");if(u)u.hidden=true;}
  else document.querySelectorAll("#opts .opt").forEach(b=>{b.disabled=true;const i=+b.dataset.i;if(r.done){if(key.includes(i))b.classList.add("ok");else if(b.getAttribute("aria-pressed")==="true")b.classList.add("bad");}else if(b.getAttribute("aria-pressed")==="true")b.classList.add("bad");});
  const sendBtn=$("#send");if(sendBtn)sendBtn.hidden=true;
  const total=r.pts+(r.bonus||0);
  const head=r.ok?(total>=100?"¡Perfecto!":"¡Bien!"):(total>0?"Casi.":"Esta vez no.");
  $("#fb").innerHTML=`<div class="card center"><div class="score ${total>0?"":"bad"}">${total>0?"+"+total:total<0?total:"0"}</div><p style="margin:6px 0 0;font-weight:800;font-size:18px">${head} ${r.bonus?`🔥 Racha: +${r.bonus}`:""}</p>${r.detail?`<p class="lead">${esc(r.detail)}</p>`:""}</div>
  <div class="why"><b>Por qué:</b> ${esc(r.why)}</div><button class="btn big" id="next">${state.you.finishedAt?"Ver el marcador final":"Siguiente reto →"}</button>`;
  $("#fb").scrollIntoView({behavior:"smooth",block:"start"});
  const nx=$("#next");if(nx)nx.addEventListener("click",()=>{if(state.you.finishedAt){view="finished";render();refresh();}else{render();refresh();window.scrollTo({top:0});}});
  const rt=$("#retry");if(rt)rt.addEventListener("click",()=>{render();});
}
function renderFinished(){
  const you=state.you;
  app.innerHTML=`<div id="hdr">${header()}</div><div class="card center"><div class="eyebrow">Recorrido completo</div><div class="score" style="margin-top:8px">${you.pts} pts</div><p class="lead">Van ${ordinal(you.position)} de ${state.teams.length}. El marcador sigue vivo hasta que el profe cierre la arena.</p></div>${rankCard()}
  <div class="card"><h3>Su recorrido</h3><table style="margin-top:8px"><thead><tr><th>Reto</th><th>Intentos</th><th>Puntos</th></tr></thead><tbody>${(you.log||[]).map(l=>{const c=CHMAP[l.ch];return`<tr><td>${esc(c?c.title:l.ch)}</td><td>${l.attempts}</td><td>${l.pts}</td></tr>`;}).join("")}</tbody></table></div>`;
  startPolling(3000);
}
function rankCard(){const max=Math.max(1,...state.teams.map(t=>t.pts));return`<div class="card"><h3>Marcador en vivo</h3><div class="rank" style="margin-top:10px">${state.teams.map((t,k)=>`<div class="r ${t.id===me.teamId?"me":""}"><div class="n">${k+1}</div><div class="track"><span style="width:${Math.max(6,t.pts/max*100)}%"></span><b>${esc(t.emoji)} ${esc(t.name)} · reto ${Math.min(t.step+1,t.total)}/${t.total}</b></div><div class="p">${t.pts}</div></div>`).join("")}</div></div>`;}
function renderEnded(){
  clearInterval(pollTimer);const rk=state.teams;const you=state.you;
  app.innerHTML=`<div id="hdr">${header()}</div><h1 class="center">¡Se acabó la arena!</h1><div class="podium"><div class="p2"><small>2.º</small><b>${esc(rk[1]?rk[1].emoji+" "+rk[1].name:"—")}</b><small>${rk[1]?.pts??0} pts</small></div><div class="p1"><small>1.º</small><b>${esc(rk[0]?rk[0].emoji+" "+rk[0].name:"—")}</b><small>${rk[0]?.pts??0} pts</small></div><div class="p3"><small>3.º</small><b>${esc(rk[2]?rk[2].emoji+" "+rk[2].name:"—")}</b><small>${rk[2]?.pts??0} pts</small></div></div>
  <div class="card center"><p style="margin:0;font-weight:800;font-size:18px">${esc(me.emoji)} ${esc(me.name)}: ${ordinal(you.position)} con ${you.pts} puntos</p></div>${rankCard()}
  <div class="why"><b>Lo que se llevan:</b> t = señal ÷ ruido; con pocos participantes el azar esconde señales grandes; significativo no es grande ni importante; el d con su intervalo dice cuánto y con qué certeza; la prueba la decide el diseño, siempre en versión Welch; y el resultado se escribe con medias, estadístico, p, d e IC, sin adjetivos.</div>
  <button class="btn sec" id="leave">Salir</button>`;
  $("#leave").addEventListener("click",()=>{me=null;save("arena-me",null);view="home";render();});
  if(you.position<=3)confetti();
}
function confetti(){const c=$("#confetti");c.hidden=false;const ctx=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const cols=["#5fe0a0","#ffb347","#7fb2ff","#ff7b6b","#eef6f0"];const Pz=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height,v:2+Math.random()*4,w:6+Math.random()*8,a:Math.random()*6.28,s:(Math.random()-.5)*.2,col:cols[Math.floor(Math.random()*cols.length)]}));let t=0;const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;(function f(){ctx.clearRect(0,0,c.width,c.height);Pz.forEach(p=>{p.y+=p.v;p.a+=p.s;if(p.y>c.height+20){p.y=-20;p.x=Math.random()*c.width;}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.col;ctx.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);ctx.restore();});if(++t<(reduce?1:360))requestAnimationFrame(f);else c.hidden=true;})();}
/* reloj del encabezado */
setInterval(()=>{const el=$("#tl");if(!el)return;const l=timeLeft();if(l===null)return;el.textContent=fmtT(l);if(l<=60000)el.classList.add("red");if(l<=0&&state&&state.game.status==="live")refresh();},1000);

/* ---------- arranque ---------- */
(async()=>{if(me){try{await refresh();if(state){startPolling(state.game.status==="live"?4000:2500);return;}}catch(_){}}render();})();
</script>
</body>
